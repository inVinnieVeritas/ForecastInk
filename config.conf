# Normal setup: enter a city and leave the three resolved values blank.
# ForecastInk resolves coordinates and timezone once, then reuses its cache.
LOCATION="Brussels"
LATITUDE=""
LONGITUDE=""
TIMEZONE=""

# For ambiguous names, include a region or country in LOCATION, for example:
# LOCATION="London, Ontario"
# LOCATION="Paris, Texas"
# LOCATION="Cambridge, UK"

# Advanced exact-location override: set all three values below. When the
# complete trio is present, geocoding is bypassed. Example:
# LATITUDE="50.87002"
# LONGITUDE="4.40824"
# TIMEZONE="Europe/Brussels"
PREVIEW_SECONDS="120"
ORIENTATION="portrait"
